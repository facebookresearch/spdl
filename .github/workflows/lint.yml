name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pyrefly:
    name: "Pyrefly (${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            config: .github/typing/pyrefly312.toml
          - python-version: '3.14'
            config: pyrefly.toml
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        # Install fbcode's NumPy 2.2 line on a compatible interpreter.
        python-version: '3.12'
    - name: Install typing dependencies
      run: |
        python -m pip install -r .github/typing/requirements.txt
        python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
    - name: Verify typing configuration
      run: python .github/typing/test_config.py
    - name: Type check
      run: |
        pyrefly check --config "${{ matrix.config }}" \
          --skip-interpreter-query \
          --site-packages-path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" \
          --output-format full-text-with-github

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Required so --from-ref/--to-ref can resolve; the default shallow
        # clone does not contain the base commit.
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - uses: pre-commit/action@v3.0.1
      with:
        # This action defaults to `--all-files`, which fails on every file that
        # predates the ruff import-sort config. On PRs, check only the files the
        # PR touches — matching fbcode's per-diff model. Manual dispatch still
        # scans the whole tree, so you can watch the backlog shrink.
        extra_args: >-
          ${{ github.event_name == 'pull_request'
              && format('--from-ref {0} --to-ref {1}',
                        github.event.pull_request.base.sha,
                        github.event.pull_request.head.sha)
              || '--all-files' }}
