name: " - Wheel (Linux)"

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      free-threaded:
        description: 'Whether FT Python or not. Valid value is "ft" or not.'
        default: ''
        type: string
      arch:
        required: true
        type: string
      machine:
        required: true
        type: string
      run-test:
        required: false
        default: 'false'
        type: string
      test-concurrency:
        required: false
        default: '3'
        type: string

env:
  ARTIFACT: wheel-linux-py${{ inputs.python-version }}${{ inputs.free-threaded }}-${{ inputs.arch }}
  STUB: stub-files-${{ inputs.arch }}-${{ inputs.python-version }}${{ inputs.free-threaded }}

jobs:
  build:
    runs-on: ${{ inputs.machine }}
    container: "quay.io/pypa/manylinux_2_28_${{ inputs.arch }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache/restore@v4
        with:
          path: src/third_party/cache
          key: "cmake-build-dependencies-${{ hashFiles('src/third_party/**/CMakeLists.txt') }}"

      - name: Build
        env:
          SPDL_USE_TRACING: 1
        run: |
          set -ex

          source .github/scripts/helper.sh
          setup_build_python "${{ inputs.python-version }}" "${{ inputs.free-threaded }}"
          retry_with_backoff dnf --refresh install -qy cmake ninja-build

          # Build package
          uv build --no-python-downloads --all-packages --wheel
          ./packaging/repair_wheels.sh manylinux_2_26_${{ inputs.arch }} ./dist ~/package

      - uses: actions/upload-artifact@v4
        name: Upload build artifact
        with:
          name: "${{ env.ARTIFACT }}"
          path: ~/package
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Check package
        run: |
          source .github/scripts/helper.sh
          # Use latest Python. (it shuold not matter)
          check_wheel_artifacts "${HOME}/package" /opt/python/cp314-cp314/bin/python

      - uses: actions/cache/save@v4
        with:
          path: src/third_party/cache
          key: "cmake-build-dependencies-${{ hashFiles('src/third_party/**/CMakeLists.txt') }}"

  check-package-dependency:
    if: "${{ inputs.run-test == 'true' }}"
    needs: ["build"]
    runs-on: ${{ inputs.machine }}
    steps:
      # Note: the suffix 't' is different
      - uses: actions/setup-python@v5
        if: ${{ inputs.free-threaded == 'ft' }}
        with:
          python-version: "${{ inputs.python-version }}t"

      - uses: actions/setup-python@v5
        if: ${{ inputs.free-threaded != 'ft' }}
        with:
          python-version: "${{ inputs.python-version }}"

      - uses: actions/download-artifact@v4
        with:
          name: "${{ env.ARTIFACT }}"
          path: ~/package
      - uses: actions/checkout@v4
      - name: Dependency Check
        run: |
          source .github/scripts/helper.sh
          python -m venv /opt/venv && . /opt/venv/bin/activate
          # Install NumPy (the only dep) of SPDL manually, so that
          # if a dependency is introduced accidentally, check_deps will catch
          python -m pip install numpy
          install_wheel_artifacts "${HOME}/package" python -m pip install --no-dependencies
          python .github/scripts/check_deps.py

  unit-test:
    if: "${{ inputs.run-test == 'true' }}"
    needs: ["build"]
    name: "test (py ${{ inputs.python-version }}, ffmpeg ${{ matrix.ffmpeg-version }})"
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["8.0", "9.0"]
    runs-on: ${{ inputs.machine }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: "${{ env.ARTIFACT }}"
          path: ~/package

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ inputs.python-version }}
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: true
          activate-environment: "test_env"

      - name: Setup
        run: |
          source .github/scripts/helper.sh
          set -ex

          prepare_conda_test_python "${{ inputs.free-threaded }}" -q -c conda-forge -n test_env

          # Install SPDL
          install_wheel_artifacts "${HOME}/package" conda run -n test_env python -m pip install
          spdl --help

          # Install PyTorch and others
          conda run -n test_env python -m pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
          conda install -q numba pytest pytest-xdist pytest-timeout parameterized matplotlib
          conda run -n test_env python -m pip install pytest-rerunfailures==16.7

          # Install FFmpeg
          # Note: Somehow FFmepg 5.1 does not install libiconv so specifying it here
          conda install -q "ffmpeg==${{ matrix.ffmpeg-version }}" libiconv
          # For some reason, the dynamic libraries are not found.
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${CONDA_PREFIX}/lib" >> $GITHUB_ENV

      - name: Unit test
        # Backstop so a hung test fails the job in minutes instead of stalling
        # until the global Actions limit. The per-test --timeout below fires first.
        timeout-minutes: 20
        run: |
          source .github/scripts/helper.sh
          set -ex

          python -c 'import spdl.io.utils;assert not spdl.io.utils.built_with_cuda()'
          run_python_tests "${{ inputs.test-concurrency }}" \
              tests/io/ \
              tests/dataloader/ \
              tests/pipeline/ \
              tests/autoresearch/

  stub-check:
    needs: ["build"]
    runs-on: ${{ inputs.machine }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: "${{ env.ARTIFACT }}"
          path: ~/package

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ inputs.python-version }}
          channels: conda-forge
          conda-remove-defaults: "true"
          auto-activate: true
          activate-environment: "test_env"

      - name: Setup
        run: |
          source .github/scripts/helper.sh
          set -ex

          prepare_conda_test_python "${{ inputs.free-threaded }}" -q -c conda-forge -n test_env

          # Install SPDL
          install_wheel_artifacts "${HOME}/package" conda run -n test_env python -m pip install
          spdl --help

          # Install deps
          conda run -n test_env python -m pip install numpy nanobind==2.13.0 typing_extensions

          # Install FFmpeg
          conda install -q ffmpeg==8
          # For some reason, the dynamic libraries are not found.
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${CONDA_PREFIX}/lib" >> $GITHUB_ENV

      - name: Generate stubs
        run: |
          set -ex
          python src/spdl/io/lib/stubgen.py --output-dir src/spdl/io/lib
          git diff --exit-code

      - uses: actions/upload-artifact@v4
        name: Upload stub
        if: failure()
        with:
          name: "${{ env.STUB }}"
          path: src/spdl/io/lib/*.pyi
          if-no-files-found: error
          retention-days: 7
          overwrite: true
