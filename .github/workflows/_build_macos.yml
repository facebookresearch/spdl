name: " - Wheel (macOS)"

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      free-threaded:
        description: 'Whether FT Python or not. Valid value is "ft" or not.'
        default: ''
        type: string
      run-test:
        required: false
        default: 'false'
        type: string
      machine:
        default: "macos-15"
        type: string
      test-concurrency:
        required: false
        default: '3'
        type: string

env:
  ARTIFACT: wheel-macos-py${{ inputs.python-version }}${{ inputs.free-threaded }}

jobs:
  build:
    runs-on: "${{ inputs.machine }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache/restore@v4
        with:
          path: src/third_party/cache
          key: "cmake-build-dependencies-${{ hashFiles('src/third_party/**/CMakeLists.txt') }}"

      - name: Build
        env:
          SPDL_USE_TRACING: 1
        run: |
          xcodebuild -version
          ls -alh /Applications/ | grep Xcode

          set -ex
          source .github/scripts/helper.sh
          install_uv curl
          setup_build_python "${{ inputs.python-version }}" "${{ inputs.free-threaded }}"
          uv build --no-python-downloads --all-packages --wheel
          mv ./dist ~/package

      - uses: actions/upload-artifact@v4
        name: Upload build artifact
        with:
          name: "${{ env.ARTIFACT }}"
          path: ~/package
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Check package
        run: |
          source .github/scripts/helper.sh
          check_wheel_artifacts "${HOME}/package"

      - uses: actions/cache/save@v4
        with:
          path: src/third_party/cache
          key: "cmake-build-dependencies-${{ hashFiles('src/third_party/**/CMakeLists.txt') }}"

  unit-test:
    if: "${{ inputs.run-test == 'true' }}"
    name: "test (ffmpeg ${{ matrix.ffmpeg-version }})"
    needs: ["build"]
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ["4.4.2", "5.1", "6.1", "7.1", "8.0", "9.0"]
    runs-on:  "${{ inputs.machine }}"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: "${{ env.ARTIFACT }}"
          path: ~/package

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ inputs.python-version }}
          conda-remove-defaults: "true"

      - name: Setup
        run: |
          source .github/scripts/helper.sh
          set -ex

          if [[ "${{ inputs.free-threaded }}" == 'ft' ]]; then
            conda install -q -c conda-forge python-freethreading
          fi

          # Install SPDL
          install_wheel_artifacts "${HOME}/package" pip install
          spdl --help

          # Install PyTorch and others
          if [[ "${{ inputs.free-threaded }}" == 'ft' ]]; then
            pip install torch numpy pytest pytest-timeout pytest-rerunfailures==16.7 parameterized matplotlib
          else
            pip install torch numpy numba pytest pytest-timeout pytest-rerunfailures==16.7 parameterized matplotlib
          fi

          # Install FFmpeg
          conda install -q -c conda-forge "ffmpeg==${{ matrix.ffmpeg-version }}"

      - name: Unit test
        # Backstop so a hung test fails the job in minutes instead of stalling
        # until the global Actions limit. The per-test --timeout below fires first.
        timeout-minutes: 20
        run: |
          source .github/scripts/helper.sh
          set -ex
          run_python_tests "${{ inputs.test-concurrency }}" \
              tests/io \
              tests/dataloader \
              tests/pipeline \
              tests/autoresearch
