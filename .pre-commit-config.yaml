default_language_version:
  node: 16.14.2

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude_types:
          - "svg"

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.2
    hooks:
      - id: clang-format
        exclude: docs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Pinned to the ruff bundled in fbsource's ruff-api==0.2.1
    # (tools/lint/pyfmt/reqs/requirements-fmt.txt) so OSS pre-commit and
    # internal `arc lint` agree. Verify with:
    #   python -c "import ruff_api; print(ruff_api.ruff_version)"
    rev: v0.14.3
    hooks:
      # Run the formatter.
      - id: ruff-format
        files: "src/|tests/|examples/|.github/"
        exclude: "src/spdl/io/lib/.+.pyi"
        types_or: [ python, pyi ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        types_or: [ python ]

  # This check is set to never fail, but will print all current mypy failures. See:
  # https://stackoverflow.com/a/59745587
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        name: mypy (src/spdl, Python 3.14)
        files: '^src/spdl/|^pyproject\.toml$|^\.pre-commit-config\.yaml$'
        types_or: [file]
        verbose: true
        entry: bash -c
        args:
          - 'mypy --config-file=pyproject.toml || true'
        language_version: python3.12
        pass_filenames: false
        additional_dependencies:
          - "numpy==2.2.6"
          - "matplotlib==3.11.2"
          - "nanobind==2.13.0"
          - "--extra-index-url=https://download.pytorch.org/whl/cpu"
          - "torch==2.15.0+cpu; sys_platform == 'linux' or sys_platform == 'win32'"
          - "torch==2.15.0; sys_platform == 'darwin'"

  - repo: local
    hooks:
      - id: pyrefly
        name: Pyrefly (full project, Python 3.14)
        entry: bash -c
        args:
          - |
            site_packages=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])') || exit 1
            pyrefly check --config pyrefly.toml --skip-interpreter-query \
              --site-packages-path "$site_packages" --output-format full-text
        language: python
        language_version: python3.12
        pass_filenames: false
        require_serial: true
        types: [file]
        files: '\.(py|pyi)$|(^|/)pyrefly[^/]*\.toml$|^pyproject\.toml$|^\.pre-commit-config\.yaml$'
        additional_dependencies:
          - "pyrefly==1.4.1"
          - "numpy==2.2.6"
          - "parameterized==0.9.0"
          - "nanobind==2.13.0"
          - "typing_extensions==4.16.0"
          - "--extra-index-url=https://download.pytorch.org/whl/cpu"
          - "torch==2.15.0+cpu; sys_platform == 'linux' or sys_platform == 'win32'"
          - "torch==2.15.0; sys_platform == 'darwin'"
